# Trojan Hub on Netlify.
# The app is prebuilt (site/index.html). Ask Tommy's AI runs in netlify/functions/tommy.mjs (/api/tommy and
# /api/tommy-requests) and reads the Claude API key from the site's ANTHROPIC_API_KEY environment variable.
[build]
  publish = "site"

[build.environment]
  # Functions run on the build's Node.js version; @netlify/blobs (the "script needed" list) needs Node 22.12 or later.
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
